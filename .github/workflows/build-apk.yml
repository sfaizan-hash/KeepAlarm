name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KeepAlarm-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log

      # Publish the APK (or the build log on failure) to a branch so it can be fetched with plain git.
      - name: Publish result to apk-build branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/KeepAlarm.apk 2>/dev/null || true
          tail -n 200 build.log > /tmp/out/build-log-tail.txt || true
          cd /tmp/out
          git init -q -b apk-build
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Build result for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
